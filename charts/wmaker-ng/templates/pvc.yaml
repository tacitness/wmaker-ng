{{- if .Values.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wmaker-ng.fullname" . }}-profile
  labels:
    {{- include "wmaker-ng.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.profile.size }}
  {{- if .Values.persistence.profile.storageClassName }}
  storageClassName: {{ .Values.persistence.profile.storageClassName }}
  {{- end }}
{{- end }}
{{- if and .Values.persistence.enabled .Values.workstation.enabled .Values.persistence.workspace.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wmaker-ng.fullname" . }}-workspace
  labels:
    {{- include "wmaker-ng.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.workspace.size }}
  {{- if .Values.persistence.workspace.storageClassName }}
  storageClassName: {{ .Values.persistence.workspace.storageClassName }}
  {{- end }}
{{- end }}
