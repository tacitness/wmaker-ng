profile: sandbox

image:
  repository: public.ecr.aws/y6d2s4r6/wmaker-ai-sandbox
  browserRepository: public.ecr.aws/y6d2s4r6/wmaker-ai-browser
  workstationRepository: public.ecr.aws/y6d2s4r6/wmaker-ai-workstation
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

service:
  enabled: false
  type: ClusterIP
  mcpPort: 9090
  novncPort: 6080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

persistence:
  enabled: false
  profile:
    size: 5Gi
    storageClassName: ""
  workspace:
    enabled: false
    size: 20Gi
    storageClassName: ""

browser:
  enabled: false
  homepage: about:blank
  profileSecretName: ""
  extraArgs: []

workstation:
  enabled: false

gpu:
  enabled: false
  dryRunOnly: true
  runtimeClassName: ""
  nodeSelector: {}
  tolerations: []
  resources:
    limits:
      nvidia.com/gpu: 1

nodeSelector: {}
tolerations: []
affinity: {}

env: []
