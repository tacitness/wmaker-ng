name: Release

# Tag-driven, like tsctl: `make bump-patch|minor|major` pushes a v* tag → this
# runs. Version lives ONLY in the tag. All third-party Actions are pinned by
# commit SHA with a version comment.
#
# Secrets follow the house pattern (dagobah-infra): GitHub Actions assumes an
# AWS role via OIDC and pulls signing keys from Secrets Manager at release
# time — nothing sensitive is stored as a GitHub Actions secret. Signing gates
# on the `AWS_ROLE_ARN` repo variable; publishing (aws s3 sync into the
# SDD-126 repos bucket, dagobah-infra#252) additionally gates on the
# `REPOS_BUCKET` repo variable. Each lane activates automatically once infra
# sets its variable, and the pipeline is green before either is wired.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Cross-build the matrix: {glibc(EL9 floor), musl} × {amd64, arm64} ─────
  build:
    name: Build ${{ matrix.stage }}
    runs-on: wmaker-ng-ci-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu.2.34, stage: amd64-gnu, arch: amd64, libc: gnu }
          - { target: aarch64-unknown-linux-gnu.2.34, stage: arm64-gnu, arch: arm64, libc: gnu }
          # EL8/Rocky 8 rpm lane (#68): glibc 2.28 floor. No tarball — the
          # portable-gnu tarball ships the 2.34 lane; this exists for *.el8.rpm.
          - { target: x86_64-unknown-linux-gnu.2.28, stage: amd64-el8, arch: amd64, libc: gnu, tarball: skip }
          - { target: aarch64-unknown-linux-gnu.2.28, stage: arm64-el8, arch: arm64, libc: gnu, tarball: skip }
          - { target: x86_64-unknown-linux-musl, stage: amd64-musl, arch: amd64, libc: musl }
          - { target: aarch64-unknown-linux-musl, stage: arm64-musl, arch: arm64, libc: musl }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # tags needed for version derivation
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-zigbuild
      - name: Derive version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Cross-build
        run: scripts/build.sh ${{ matrix.target }} ${{ matrix.stage }}
      - name: Tarball
        if: matrix.tarball != 'skip'
        run: scripts/tarball.sh ${{ matrix.arch }} ${{ matrix.libc }} ${{ matrix.stage }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.stage }}
          path: dist/
          retention-days: 7

  # ── 2. Package: deb/rpm (glibc) + apk (musl) for both arches via nfpm ─────────
  packages:
    name: Package (deb/rpm/apk)
    needs: build
    runs-on: wmaker-ng-ci-build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Derive version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build packages (Debian container)
        # The ARC runners are rootless (no-new-privileges: sudo can never
        # work) and ship no envsubst; nfpm is a Go binary from goreleaser's
        # GitHub releases that taiki-e/install-action no longer carries. Run
        # the whole packaging stage in a Debian container via the dind
        # sidecar — same pattern as the apk repo assembly.
        env:
          NFPM_VERSION: "2.47.0"
        run: |
          set -euo pipefail
          # --network host: the dind daemon runs with --iptables=false, so
          # bridge-networked containers have no egress/DNS; host = pod netns.
          docker run --rm --network host -v "$PWD:/w" -w /w \
            -e PKG_VERSION -e NFPM_VERSION \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            debian:trixie-slim bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                make gettext-base ca-certificates curl rpm cpio >/dev/null
              case "$(uname -m)" in
                x86_64)  arch=x86_64; sha=0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 ;;
                aarch64) arch=arm64;  sha=1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c ;;
                *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
              esac
              tgz="nfpm_${NFPM_VERSION}_Linux_${arch}.tar.gz"
              curl -fsSL -o "/tmp/$tgz" \
                "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${tgz}"
              echo "$sha  /tmp/$tgz" | sha256sum -c -
              tar -C /usr/local/bin -xzf "/tmp/$tgz" nfpm
              nfpm --version
              make packages
              chown -R "$HOST_UID:$HOST_GID" dist
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/pkg/
          retention-days: 7

  sandbox-image:
    name: Publish sandbox image to ECR Public
    needs: build
    runs-on: wmaker-ng-ci-build
    permissions:
      contents: read
      id-token: write
    env:
      HAS_ECR_PUBLIC: ${{ vars.AWS_ROLE_ARN != '' && vars.ECR_PUBLIC_PUBLISH == 'true' }}
      ECR_PUBLIC_ALIAS: ${{ vars.ECR_PUBLIC_ALIAS || 'y6d2s4r6' }}
      ECR_PUBLIC_REPO: ${{ vars.ECR_PUBLIC_SANDBOX_REPO || 'wmaker-ai-sandbox' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-amd64-gnu
          path: dist/
      - name: Derive version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Stage ai-mcp for image build
        run: install -m 0755 dist/bin/amd64-gnu/ai-mcp sandbox/ai-mcp
      - name: Configure AWS credentials (OIDC)
        if: env.HAS_ECR_PUBLIC == 'true'
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: wmaker-ng-ecr-public-${{ github.run_id }}
      - name: Build sandbox image
        run: |
          set -euo pipefail
          docker build --network host \
            --label "org.opencontainers.image.version=$PKG_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "wmaker-ai-sandbox:$PKG_VERSION" \
            -t "wmaker-ai-sandbox:latest" \
            sandbox
      - name: Push sandbox image to ECR Public
        if: env.HAS_ECR_PUBLIC == 'true'
        run: |
          set -euo pipefail
          repo="public.ecr.aws/$ECR_PUBLIC_ALIAS/$ECR_PUBLIC_REPO"
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws
          docker tag "wmaker-ai-sandbox:$PKG_VERSION" "$repo:$PKG_VERSION"
          docker tag "wmaker-ai-sandbox:$PKG_VERSION" "$repo:latest"
          docker push "$repo:$PKG_VERSION"
          docker push "$repo:latest"

  # ── 3. Assemble + sign repos, publish, and cut the GitHub Release ────────────
  release:
    name: Sign, publish & release
    needs: packages
    runs-on: wmaker-ng-ci-build
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC: assume the AWS role
    env:
      AWS_REGION: us-west-2
      # INCOMING MODEL (dagobah-infra#306, SDD-305 §5): this producer holds NO
      # repo signing keys and writes NO shared metadata — it hands packages to
      # _incoming/wmaker-ng/ and the infra repo-indexer signs + publishes.
      # Only the AUR deploy key remains producer-side.
      SM_AUR_KEY: ${{ vars.SM_AUR_KEY || '/tacitsoft/wmaker-ng/aur-deploy-ssh-key' }}
      HAS_AWS: ${{ vars.AWS_ROLE_ARN != '' }}
      HAS_REPOS: ${{ vars.AWS_ROLE_ARN != '' && vars.REPOS_BUCKET != '' }}
      HAS_AUR: ${{ vars.AUR_PUBLISH == 'true' && vars.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist/pkg/
      - name: Derive version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Configure AWS credentials (OIDC)
        if: env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: wmaker-ng-release-${{ github.run_id }}

      - name: Build static tar.zst channel (Debian container)
        # Rootless runners carry no zstd — run in a container (dind).
        # No repo assembly and no signing here: the repo-indexer
        # (dagobah-infra#306) owns shared metadata + keys.
        run: |
          set -euo pipefail
          # --network host: see packaging job — dind runs --iptables=false.
          docker run --rm --network host -v "$PWD:/w" -w /w \
            -e PKG_VERSION \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            debian:trixie-slim bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends zstd >/dev/null
              scripts/static-channel.sh dist/tarballs "$PKG_VERSION" dist/repo/releases/wmaker-ng
              chown -R "$HOST_UID:$HOST_GID" dist
            '

      - name: Hand off packages to the repo-indexer
        if: env.HAS_REPOS == 'true'
        env:
          REPOS_BUCKET: ${{ vars.REPOS_BUCKET }}
        run: scripts/publish.sh dist/pkg dist/repo/releases/wmaker-ng

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent so a rerun (e.g. to fire the publish lane after infra
        # flips a gate) doesn't go red on the pre-existing release.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — skipping create"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/tarballs/* dist/pkg/* dist/repo/releases/wmaker-ng/install.sh dist/repo/releases/wmaker-ng/$PKG_VERSION/*
          fi

      - name: Publish AUR packages
        if: env.HAS_AUR == 'true'
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          aws secretsmanager get-secret-value --secret-id "$SM_AUR_KEY" \
            --query SecretString --output text | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          scripts/publish-aur.sh dist/repo/releases/wmaker-ng/$PKG_VERSION "$PKG_VERSION"
