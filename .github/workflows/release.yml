name: Release

# Tag-driven, like tsctl: `make bump-patch|minor|major` pushes a v* tag → this
# runs. Version lives ONLY in the tag. All third-party Actions are pinned by
# commit SHA with a version comment.
#
# Secrets follow the house pattern (dagobah-infra): GitHub Actions assumes an
# AWS role via OIDC and pulls signing keys from Secrets Manager at release
# time — nothing sensitive is stored as a GitHub Actions secret. Signing gates
# on the `AWS_ROLE_ARN` repo variable; publishing (aws s3 sync into the
# SDD-126 repos bucket, dagobah-infra#252) additionally gates on the
# `REPOS_BUCKET` repo variable. Each lane activates automatically once infra
# sets its variable, and the pipeline is green before either is wired.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Cross-build the matrix: {glibc(EL9 floor), musl} × {amd64, arm64} ─────
  build:
    name: Build ${{ matrix.stage }}
    runs-on: wmaker-ng-ci-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu.2.34, stage: amd64-gnu, arch: amd64, libc: gnu }
          - { target: aarch64-unknown-linux-gnu.2.34, stage: arm64-gnu, arch: arm64, libc: gnu }
          - { target: x86_64-unknown-linux-musl, stage: amd64-musl, arch: amd64, libc: musl }
          - { target: aarch64-unknown-linux-musl, stage: arm64-musl, arch: arm64, libc: musl }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # tags needed for version derivation
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-zigbuild
      - name: Derive version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Cross-build
        run: scripts/build.sh ${{ matrix.target }} ${{ matrix.stage }}
      - name: Tarball
        run: scripts/tarball.sh ${{ matrix.arch }} ${{ matrix.libc }} ${{ matrix.stage }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.stage }}
          path: dist/
          retention-days: 7

  # ── 2. Package: deb/rpm (glibc) + apk (musl) for both arches via nfpm ─────────
  packages:
    name: Package (deb/rpm/apk)
    needs: build
    runs-on: wmaker-ng-ci-build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Derive version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build packages (Debian container)
        # The ARC runners are rootless (no-new-privileges: sudo can never
        # work) and ship no envsubst; nfpm is a Go binary from goreleaser's
        # GitHub releases that taiki-e/install-action no longer carries. Run
        # the whole packaging stage in a Debian container via the dind
        # sidecar — same pattern as the apk repo assembly.
        env:
          NFPM_VERSION: "2.47.0"
        run: |
          set -euo pipefail
          # --network host: the dind daemon runs with --iptables=false, so
          # bridge-networked containers have no egress/DNS; host = pod netns.
          docker run --rm --network host -v "$PWD:/w" -w /w \
            -e PKG_VERSION -e NFPM_VERSION \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            debian:trixie-slim bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                make gettext-base ca-certificates curl >/dev/null
              case "$(uname -m)" in
                x86_64)  arch=x86_64; sha=0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 ;;
                aarch64) arch=arm64;  sha=1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c ;;
                *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
              esac
              tgz="nfpm_${NFPM_VERSION}_Linux_${arch}.tar.gz"
              curl -fsSL -o "/tmp/$tgz" \
                "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${tgz}"
              echo "$sha  /tmp/$tgz" | sha256sum -c -
              tar -C /usr/local/bin -xzf "/tmp/$tgz" nfpm
              nfpm --version
              make packages
              chown -R "$HOST_UID:$HOST_GID" dist
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/pkg/
          retention-days: 7

  # ── 3. Assemble + sign repos, publish, and cut the GitHub Release ────────────
  release:
    name: Sign, publish & release
    needs: packages
    runs-on: wmaker-ng-ci-build
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC: assume the AWS role
    env:
      AWS_REGION: us-west-2
      # Secrets Manager secret ids (override via repo vars if infra names differ).
      SM_GPG_KEY: ${{ vars.SM_GPG_KEY || '/tacitsoft/wmaker-ng/gpg-signing-key' }}
      SM_APK_KEY: ${{ vars.SM_APK_KEY || '/tacitsoft/wmaker-ng/apk-signing-key' }}
      SM_AUR_KEY: ${{ vars.SM_AUR_KEY || '/tacitsoft/wmaker-ng/aur-deploy-ssh-key' }}
      # Signing activates once infra sets the AWS_ROLE_ARN repo variable;
      # repo publishing additionally needs REPOS_BUCKET (deferred until the
      # SDD-126 S3+CloudFront site is applied — dagobah-infra#252).
      HAS_AWS: ${{ vars.AWS_ROLE_ARN != '' }}
      HAS_REPOS: ${{ vars.AWS_ROLE_ARN != '' && vars.REPOS_BUCKET != '' }}
      HAS_AUR: ${{ vars.AUR_PUBLISH == 'true' && vars.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist/pkg/
      - name: Derive version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Configure AWS credentials (OIDC)
        if: env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: wmaker-ng-release-${{ github.run_id }}

      - name: Fetch signing material from Secrets Manager
        if: env.HAS_AWS == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/.keys && chmod 700 dist/.keys
          # GPG private key → apt (reprepro) + rpm (rpm --addsign). Kept on
          # disk (0600, ephemeral runner) so the assembly containers can
          # import it; key id derived via the host gpg.
          aws secretsmanager get-secret-value --secret-id "$SM_GPG_KEY" \
            --query SecretString --output text > dist/.keys/gpg-signing-key.asc
          chmod 600 dist/.keys/gpg-signing-key.asc
          gpg --batch --import dist/.keys/gpg-signing-key.asc
          key_id="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          echo "GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"
          # apk RSA private key → abuild-sign (separate key from GPG).
          aws secretsmanager get-secret-value --secret-id "$SM_APK_KEY" \
            --query SecretString --output text > dist/.keys/wmaker-ng.rsa
          chmod 600 dist/.keys/wmaker-ng.rsa
          # Matching .pub so repo-apk.sh exports it into the repo tree —
          # clients install it as /etc/apk/keys/wmaker-ng.rsa.pub.
          openssl rsa -in dist/.keys/wmaker-ng.rsa -pubout \
            -out dist/.keys/wmaker-ng.rsa.pub 2>/dev/null
          echo "ABUILD_KEY=$PWD/dist/.keys/wmaker-ng.rsa" >> "$GITHUB_ENV"

      - name: Assemble apt + rpm repos + static channel (Debian container)
        # Rootless runners carry no reprepro/createrepo_c/rpm/zstd — run the
        # assembly in a container (dind), like the apk stage below.
        run: |
          set -euo pipefail
          # --network host: see packaging job — dind runs --iptables=false.
          docker run --rm --network host -v "$PWD:/w" -w /w \
            -e PKG_VERSION -e GPG_KEY_ID \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            debian:trixie-slim bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                reprepro createrepo-c rpm gnupg zstd make >/dev/null
              if [ -s dist/.keys/gpg-signing-key.asc ]; then
                gpg --batch --quiet --import dist/.keys/gpg-signing-key.asc
              fi
              make repo-apt repo-rpm
              scripts/static-channel.sh dist/tarballs "$PKG_VERSION" dist/repo/static
              chown -R "$HOST_UID:$HOST_GID" dist
            '

      - name: Assemble apk repo (Alpine container)
        run: |
          keyenv=""
          [ -n "${ABUILD_KEY:-}" ] && keyenv="-e ABUILD_KEY=/w/dist/.keys/wmaker-ng.rsa"
          docker run --rm --network host -v "$PWD:/w" -w /w $keyenv \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            alpine:3.22 sh -c \
            'apk add --no-cache bash abuild >/dev/null \
             && bash scripts/repo-apk.sh dist/repo/apk dist/pkg \
             && chown -R "$HOST_UID:$HOST_GID" dist/repo/apk'

      - name: Export public keys into the repo tree
        if: env.HAS_AWS == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/repo/keys
          gpg --batch --armor --export "$GPG_KEY_ID" \
            > dist/repo/keys/wmaker-ng-release.gpg.asc
          cp dist/.keys/wmaker-ng.rsa.pub dist/repo/keys/wmaker-ng.rsa.pub

      - name: Publish repos to repos.tacitsoft.dev
        if: env.HAS_REPOS == 'true'
        env:
          REPOS_BUCKET: ${{ vars.REPOS_BUCKET }}
        run: scripts/publish.sh dist/repo

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/tarballs/* dist/pkg/* dist/repo/static/install.sh dist/repo/static/releases/$PKG_VERSION/*

      - name: Publish AUR packages
        if: env.HAS_AUR == 'true'
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          aws secretsmanager get-secret-value --secret-id "$SM_AUR_KEY" \
            --query SecretString --output text | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          scripts/publish-aur.sh dist/repo/static/releases/$PKG_VERSION "$PKG_VERSION"
